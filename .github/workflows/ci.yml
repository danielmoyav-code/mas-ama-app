name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  qa-static:
    name: QA Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run QA static checks
        run: node scripts/qa-check.js

      - name: Verify icons exist
        run: |
          test -f icons/icon-192.png || (echo "Missing icon-192.png" && exit 1)
          test -f icons/icon-512.png || (echo "Missing icon-512.png" && exit 1)
          echo "Icons present"

      - name: Verify manifest.json is valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          echo "manifest.json is valid JSON"

      - name: Verify package.json is valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          echo "package.json is valid JSON"

      - name: Check sw.js cache version
        run: |
          grep -E "const CACHE = 'masama-v[0-9]+'" sw.js || (echo "sw.js cache version not found" && exit 1)
          echo "sw.js cache version OK"

      - name: Check Code.gs uses Santiago timezone
        run: |
          COUNT=$(grep -c "America/Santiago" Code.gs)
          if [ "$COUNT" -lt 5 ]; then
            echo "Code.gs has only $COUNT references to America/Santiago (expected >= 5)"
            exit 1
          fi
          echo "Code.gs Santiago refs: $COUNT"

  smoke-test:
    name: Smoke Test — load app.js parseable
    runs-on: ubuntu-latest
    needs: qa-static
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check app.js parses as valid JSX-via-Babel
        run: |
          npm install --no-save @babel/parser @babel/plugin-syntax-jsx
          node -e "
          const fs = require('fs');
          const parser = require('@babel/parser');
          const src = fs.readFileSync('app.js','utf8');
          try {
            parser.parse(src, {
              sourceType: 'script',
              plugins: ['jsx'],
              errorRecovery: false,
            });
            console.log('✅ app.js parses OK');
          } catch(e) {
            console.error('❌ app.js parse error:', e.message);
            process.exit(1);
          }
          "

      - name: Check Code.gs basic syntax
        run: |
          node -e "
          const fs = require('fs');
          const src = fs.readFileSync('Code.gs','utf8');
          // Check balanced braces / parens
          const open = (src.match(/\{/g)||[]).length;
          const close = (src.match(/\}/g)||[]).length;
          if (open !== close) {
            console.error('Unbalanced braces: open=' + open + ' close=' + close);
            process.exit(1);
          }
          console.log('Code.gs braces balanced');
          "
